sentry_chassis_controller:
  type: "sentry_chassis_controller/SentryChassisController"
  cmd_vel_topic: "/cmd_vel"
  cmd_vel_timeout: 0.25
  enable_dynamic_reconfigure: true

  steer_joints:
    - "front_left_steer_joint"
    - "front_right_steer_joint"
    - "rear_left_steer_joint"
    - "rear_right_steer_joint"

  wheel_joints:
    - "front_left_wheel_joint"
    - "front_right_wheel_joint"
    - "rear_left_wheel_joint"
    - "rear_right_wheel_joint"

  geometry:
    wheel_base: 0.50
    track_width: 0.40
    wheel_radius: 0.076

  steer_zero_offsets: [0.0, 0.0, 0.0, 0.0]

  pid:
    steer:
      front_left:
        p: 5.0
        i: 0.0
        d: 0.1
        i_clamp_min: -1.0
        i_clamp_max: 1.0
        antiwindup: false
        publish_state: true
      front_right:
        p: 5.0
        i: 0.0
        d: 0.1
        i_clamp_min: -1.0
        i_clamp_max: 1.0
        antiwindup: false
        publish_state: true
      rear_left:
        p: 5.0
        i: 0.0
        d: 0.1
        i_clamp_min: -1.0
        i_clamp_max: 1.0
        antiwindup: false
        publish_state: true
      rear_right:
        p: 5.0
        i: 0.0
        d: 0.1
        i_clamp_min: -1.0
        i_clamp_max: 1.0
        antiwindup: false
        publish_state: true
    wheel:
      front_left:
        p: 10.0
        i: 0.0
        d: 0.2
        i_clamp_min: -2.0
        i_clamp_max: 2.0
        antiwindup: false
        publish_state: true
      front_right:
        p: 10.0
        i: 0.0
        d: 0.2
        i_clamp_min: -2.0
        i_clamp_max: 2.0
        antiwindup: false
        publish_state: true
      rear_left:
        p: 10.0
        i: 0.0
        d: 0.2
        i_clamp_min: -2.0
        i_clamp_max: 2.0
        antiwindup: false
        publish_state: true
      rear_right:
        p: 10.0
        i: 0.0
        d: 0.2
        i_clamp_min: -2.0
        i_clamp_max: 2.0
        antiwindup: false
        publish_state: true
